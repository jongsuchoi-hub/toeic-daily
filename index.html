<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토익 800 매일 학습</title>
<meta name="description" content="빈출 단어·문법·듣기·독해를 하루 분량으로 묶은 토익 매일 학습 도구">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📘</text></svg>">
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --ink: #1b1f27; --muted: #6b7280; --line: #e3e6eb;
    --brand: #2557d6; --brand-soft: #e8eefc; --ok: #138a52; --ok-soft: #e4f5ec; --no: #c43d3d; --no-soft: #fbe9e9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --card: #1b2029; --ink: #e9ecf1; --muted: #9aa3b2; --line: #2b313c;
      --brand: #6f97ff; --brand-soft: #1f2a44; --ok: #4cc58a; --ok-soft: #173326; --no: #f07a7a; --no-soft: #3a1d1f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  #app { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 26px; margin: 2px 0 12px; }
  h2 { font-size: 15px; margin: 18px 0 10px; color: var(--muted); font-weight: 600; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .muted { color: var(--muted); } .small { font-size: 14px; }
  .eyebrow { margin: 0; color: var(--brand); font-weight: 600; font-size: 14px; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 8px; min-height: 36px; }
  .streak { text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 6px 14px; }
  .streak b { display: block; font-size: 24px; line-height: 1.1; color: var(--brand); }
  .streak span { font-size: 12px; color: var(--muted); }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 8px 0 6px; }
  .bar i { display: block; height: 100%; background: var(--brand); transition: width .3s; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
  .card { text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 2px; min-height: 112px; }
  .card:hover { border-color: var(--brand); }
  .card.done { background: var(--ok-soft); border-color: transparent; }
  .card-t { font-weight: 700; }
  .card-s { font-size: 13px; color: var(--muted); }
  .card-r { margin-top: auto; font-size: 14px; font-weight: 600; color: var(--brand); }
  .card.done .card-r { color: var(--ok); }
  .wide { display: block; width: 100%; padding: 14px; border-radius: 14px; border: 0; background: var(--brand); color: #fff; font-weight: 700; margin: 10px 0; }
  .wide.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .wide b { margin-left: 4px; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 4px 16px 14px; margin-top: 14px; }
  .week { display: flex; justify-content: space-between; }
  .day { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); }
  .day.today span { color: var(--brand); font-weight: 700; }
  .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--line); }
  .dot.l1 { background: color-mix(in srgb, var(--brand) 30%, var(--line)); }
  .dot.l2 { background: color-mix(in srgb, var(--brand) 55%, var(--line)); }
  .dot.l3 { background: color-mix(in srgb, var(--brand) 78%, var(--line)); }
  .dot.l4 { background: var(--brand); }
  .acc { list-style: none; padding: 0; margin: 0; }
  .acc li { display: grid; grid-template-columns: 110px 1fr 44px; align-items: center; gap: 10px; font-size: 14px; padding: 4px 0; }
  .acc b { text-align: right; }
  .accbar { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .accbar i { display: block; height: 100%; background: var(--ok); }
  .foot { font-size: 12px; color: var(--muted); text-align: center; margin-top: 24px; }
  .back { background: none; border: 0; padding: 6px 0; color: var(--muted); }
  .q { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; margin: 14px 0; }
  .word { font-size: 30px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
  .icon { background: var(--brand-soft); border: 0; border-radius: 10px; font-size: 18px; padding: 4px 8px; }
  .ex { color: var(--muted); margin: 6px 0 0; }
  .ask { font-weight: 600; margin: 12px 0 0; }
  .tag { display: inline-block; font-size: 12px; font-weight: 700; color: var(--brand); background: var(--brand-soft); border-radius: 6px; padding: 1px 7px; margin: 0 0 8px; }
  .sent { font-size: 18px; margin: 0; }
  .blank { color: var(--brand); font-weight: 700; }
  .play { display: block; margin: 14px 0 6px; background: var(--brand); color: #fff; border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 700; }
  .link { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; font-size: 14px; }
  .script { margin-top: 10px; padding: 10px 12px; background: var(--bg); border-radius: 10px; font-size: 15px; }
  .passage { white-space: normal; background: var(--bg); border-radius: 12px; padding: 14px; font-size: 15px; margin-bottom: 14px; max-height: 46vh; overflow: auto; }
  .ptitle { margin: 0 0 6px; font-weight: 700; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  .choices { display: grid; gap: 8px; }
  .choices.row { grid-template-columns: repeat(3, 1fr); }
  .choice { text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .choices.row .choice { text-align: center; }
  .choice:hover:not(:disabled) { border-color: var(--brand); }
  .choice:disabled { cursor: default; }
  .choice.right { border-color: var(--ok); background: var(--ok-soft); }
  .choice.wrong { border-color: var(--no); background: var(--no-soft); }
  .choices.row .choice.right, .choices.row .choice.wrong, .choices.row .choice:disabled { grid-column: 1 / -1; text-align: left; }
  .fb { border-radius: 12px; padding: 12px 14px; margin-top: 14px; }
  .fb.ok { background: var(--ok-soft); } .fb.ok b { color: var(--ok); }
  .fb.no { background: var(--no-soft); } .fb.no b { color: var(--no); }
  .fb p { margin: 4px 0 0; }
  .result { text-align: center; padding-top: 40px; }
  .big { font-size: 64px; font-weight: 800; color: var(--brand); }
  .big span { font-size: 28px; color: var(--muted); }
  .notes { list-style: none; padding: 0; }
  .notes li { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 10px; }
  .notes .tag { margin: 0 6px 0 0; }
  .ans { margin-top: 6px; font-weight: 700; color: var(--ok); }
  .exp { font-size: 14px; color: var(--muted); }
  .mini { margin-top: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; font-size: 13px; }
</style>
</head>
<body>
<main id="app"></main>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
